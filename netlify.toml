[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  external_node_modules = []

# ── Redirect bot traffic to the Netlify functions ─────────────────────────────
[[redirects]]
  from = "/api/webhook"
  to   = "/.netlify/functions/webhook"
  status = 200
  force  = true

[[redirects]]
  from = "/api/set_webhook"
  to   = "/.netlify/functions/set_webhook"
  status = 200
  force  = true

[[redirects]]
  from = "/api/cron"
  to   = "/.netlify/functions/cron"
  status = 200
  force  = true


# ── Scheduled morning briefing at 8:00 AM IST (2:30 AM UTC) ─────────────────
[functions."cron"]
  schedule = "30 2 * * *"
